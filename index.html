<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(-45deg, #6b21a8, #c026d3, #ec4899, #f97316);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="gradient-bg text-white">

    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-2xl text-center">
            <h1 class="text-5xl md:text-7xl font-bold mb-4 drop-shadow-lg">Welcome to Our Platform</h1>
            <p class="text-lg md:text-xl text-purple-100 mb-8 drop-shadow-md">
                This is the main landing page, hosted for speed and reliability on GitHub Pages.
            </p>
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="http://profiles.your-domain.com/user/JaneDoe" 
                   class="bg-white text-purple-700 font-semibold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300 ease-in-out">
                    View Example Profile
                </a>
                <a href="http://profiles.your-domain.com/login" 
                   class="bg-purple-500/50 backdrop-blur-sm border border-white/20 font-semibold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300 ease-in-out">
                    Login / Sign Up
                </a>
            </div>
            <p class="text-sm mt-8 text-purple-200">
                User profiles and dynamic content are served by our robust backend on InfinityFree.
            </p>
        </div>
    </div>
    <!-- 
        IMPORTANT: Before you use this file, you must replace 'your-domain.com' in the links above
        with the actual domain you registered with InfinityFree.
    -->
</body>
</html>
